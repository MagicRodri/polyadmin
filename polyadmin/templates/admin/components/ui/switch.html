{# Switch, ported from shadcn/ui.

   Radix renders a <button role="switch"> with a hidden input kept in
   sync. This is a native checkbox instead, visually identical: the
   input is sr-only and the track and thumb are its siblings, driven
   entirely by peer-checked:, so the switch toggles with no JavaScript
   at all.

   It posts exactly like a checkbox -- the field's name with value
   "true" when on, nothing when off -- and is read as `== "true"`, so
   absent reads as false.

   The generated boolean field renders this control inline with its
   label; this wrapper is for custom pages, which want the label and
   help text laid out for them. #}
{% macro switch_control(name, id, checked=false, disabled=false) %}
<label class="{{ ui('switch') }}">
  <input type="checkbox" id="{{ id }}" name="{{ name }}" value="true" autocomplete="off"
         role="switch"
         {% if checked %}checked{% endif %}
         {% if disabled %}disabled{% endif %}
         class="{{ ui('switch', 'input') }}">
  <span class="{{ ui('switch', 'track') }}"></span>
  <span class="{{ ui('switch', 'thumb') }}"></span>
</label>
{% endmacro %}

{% macro switch(name, label, checked=false, help=none) %}
<div class="mb-4 {{ ui('field', 'row') }}">
  {{ switch_control(name, "switch-" ~ name, checked) }}
  <span class="{{ ui('field', 'row-text') }}">
    <label for="switch-{{ name }}" class="{{ ui('label') }}">{{ label }}</label>
    {% if help %}<p class="{{ ui('field', 'description') }}">{{ help }}</p>{% endif %}
  </span>
</div>
{% endmacro %}
