{# Switch, ported from shadcn/ui (Radix Switch).

   Mirrors go-polyadmin/templates/admin/components/ui/switch.html.

   Radix renders a <button role="switch"> and keeps a hidden input in
   sync so the control still posts. This is a native checkbox instead,
   visually identical: the input is sr-only and the track and thumb are
   its siblings, driven entirely by peer-checked:. That means the switch
   toggles with no JavaScript at all -- an earlier Alpine version only
   degraded to "whatever the server rendered" without it.

   It posts exactly like a checkbox: the field's name with value "true"
   when on, nothing when off. Both the generated form fields and the
   example custom pages read it as `== "true"`, so absent reads as
   false, which is the ordinary HTML convention.

   The generated boolean form field renders this same control inline
   with its label (see components/ui/field.html); this wrapper is for
   custom admin pages (docs/routing.md), which want the label and help
   text laid out for them. #}
{% macro switch_control(name, id, checked=false, disabled=false) %}
<label class="{{ ui('switch') }}">
  <input type="checkbox" id="{{ id }}" name="{{ name }}" value="true" autocomplete="off"
         role="switch"
         {% if checked %}checked{% endif %}
         {% if disabled %}disabled{% endif %}
         class="{{ ui('switch', 'input') }}">
  <span class="{{ ui('switch', 'track') }}"></span>
  <span class="{{ ui('switch', 'thumb') }}"></span>
</label>
{% endmacro %}

{% macro switch(name, label, checked=false, help=none) %}
<div class="mb-4 {{ ui('field', 'row') }}">
  {{ switch_control(name, "switch-" ~ name, checked) }}
  <span class="{{ ui('field', 'row-text') }}">
    <label for="switch-{{ name }}" class="{{ ui('label') }}">{{ label }}</label>
    {% if help %}<p class="{{ ui('field', 'description') }}">{{ help }}</p>{% endif %}
  </span>
</div>
{% endmacro %}
