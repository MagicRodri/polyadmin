{# Search bar. Auto-submits via HTMX, swapping just #resource-list, and
   carries the current filters and sort as hidden fields so searching
   never clears them. #}
<form class="{{ ui('toolbar', 'item') }}"
  hx-get="{{ base_path }}/{{ model_admin.get_slug() }}"
  hx-target="#resource-list"
  hx-select="#resource-list"
  hx-swap="outerHTML"
  hx-push-url="true"
  hx-trigger="keyup changed delay:400ms from:input[name='search'], change"
>
  <input type="hidden" name="sort" value="{{ ordering }}">
  {% for name, value in filters.items() %}
  <input type="hidden" name="filter[{{ name }}]" value="{{ value }}">
  {% endfor %}
  <input type="search" id="search" name="search" value="{{ search }}"
         placeholder="{{ _('Search…') }}"
         class="{{ ui('input') }} lg:w-64">
</form>
