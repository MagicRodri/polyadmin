<div class="space-y-2">
  {% for label, value, percent in widget_data.series %}
  <div>
    <div class="mb-0.5 flex justify-between text-xs text-neutral-600">
      <span>{{ label }}</span><span>{{ value }}</span>
    </div>
    <div class="h-2 w-full rounded-full bg-neutral-100">
      <div class="h-2 rounded-full bg-neutral-900" style="width: {{ percent }}%"></div>
    </div>
  </div>
  {% endfor %}
  {% if not widget_data.series %}
  <p class="text-sm text-neutral-400">No data.</p>
  {% endif %}
</div>
