<div class="space-y-2">
  {% for label, value, percent in widget_data.series %}
  <div>
    <div class="mb-0.5 flex justify-between text-xs text-muted-foreground">
      <span>{{ label }}</span><span>{{ value }}</span>
    </div>
    <div class="{{ ui('widget', 'bar-track') }}">
      <div class="{{ ui('widget', 'bar-fill') }}" style="width: {{ percent }}%"></div>
    </div>
  </div>
  {% endfor %}
  {% if not widget_data.series %}
  <p class="text-sm text-muted-foreground">No data.</p>
  {% endif %}
</div>
