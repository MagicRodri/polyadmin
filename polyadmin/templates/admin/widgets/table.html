<div class="overflow-x-auto">
<table class="min-w-full text-sm">
  <thead>
    <tr class="bg-neutral-50">
      {% for column in widget_data.columns %}
      <th class="px-2 py-1.5 text-left text-xs font-medium uppercase tracking-wide text-neutral-500 whitespace-nowrap">{{ column }}</th>
      {% endfor %}
    </tr>
  </thead>
  <tbody class="divide-y divide-neutral-100">
    {% for row in widget_data.rows %}
    <tr class="hover:bg-neutral-50">
      {% for column in widget_data.columns %}
      <td class="px-2 py-1.5 text-neutral-700 whitespace-nowrap">{{ row[column] }}</td>
      {% endfor %}
    </tr>
    {% endfor %}
  </tbody>
</table>
{% if not widget_data.rows %}
<p class="text-sm text-neutral-400">No data.</p>
{% endif %}
</div>
