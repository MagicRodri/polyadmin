[project]
name = "polyadmin"
version = "0.1.0"
description = "PolyAdmin: cross-language server-rendered admin framework (Python core)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jinja2>=3.1"]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
]
export-xlsx = [
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polyadmin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
