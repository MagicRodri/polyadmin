{% extends "admin/base.html" %}
{% block title %}Broadcast Message{% endblock %}
{% block content %}
<form method="post" action="{{ base_path }}/tools/broadcast"
      class="w-full max-w-xl rounded-lg border border-neutral-200/70 bg-white p-7 shadow-sm">
  <h2 class="mb-1 text-lg font-semibold text-neutral-900">Broadcast a message</h2>
  <p class="mb-4 text-sm text-neutral-500">
    Sends a one-off notice to every active user -- a stand-in for a
    department-facing wizard that isn't resource CRUD.
  </p>
  {% if error %}
  <div class="relative mb-4 rounded-lg border border-transparent bg-red-600 p-4 text-white">
    <p class="text-sm opacity-80">{{ error }}</p>
  </div>
  {% endif %}
  <label class="mb-4 block">
    <span class="mb-1.5 block text-sm font-medium text-neutral-700">Message</span>
    <textarea name="message" rows="4" required
              class="block w-full rounded-md border border-neutral-200 bg-white px-3 py-2 text-sm text-neutral-900 shadow-sm focus:border-neutral-400 focus:outline-none focus:ring-0"></textarea>
  </label>
  <button type="submit"
          class="inline-flex items-center justify-center gap-1.5 rounded-md bg-neutral-950 px-4 py-2 text-sm font-medium tracking-wide text-white transition-colors duration-200 hover:bg-neutral-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-neutral-900">
    Send broadcast
  </button>
</form>
{% endblock %}
