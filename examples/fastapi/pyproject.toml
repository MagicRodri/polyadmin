[project]
name = "polyadmin-example-fastapi"
version = "0.1.0"
description = "Reference FastAPI application exercising the PolyAdmin Python package"
requires-python = ">=3.10"
dependencies = [
    "polyadmin[export-xlsx]",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
polyadmin = { path = "../..", editable = true }

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
